<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Reel Augmain — la rue</title>
<!-- Studio : page filmée par Playwright pour fabriquer des vidéos verticales (Reels, TikTok). Pas publiée sur le site. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="/v3.css">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(1200px 900px at 50% 45%,#eef3ec,#fbfcfa 70%)}
  body{padding:0}
  .haut-reel{position:absolute;left:80px;right:80px;top:150px;height:420px}
  .phrase{position:absolute;inset:0;font-weight:900;font-stretch:115%;letter-spacing:-.035em;font-size:96px;line-height:1;color:#0f2340;opacity:0}
  .phrase em{font-style:normal;background:linear-gradient(transparent 60%,#ffc83d 60%)}
  .p1{animation:passe 4.2s .3s both}
  .p2{animation:passe 4.2s 4.5s both}
  .p3{animation:reste 4s 8.7s both}
  @keyframes passe{0%{opacity:0;transform:translateY(40px)}10%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-30px)}}
  @keyframes reste{0%{opacity:0;transform:translateY(40px)}12%,100%{opacity:1;transform:none}}
  .rue{position:absolute;left:-40px;right:-40px;top:560px;width:auto;margin:0}
  .rue .recherche{font-size:30px;padding:20px 32px;top:0;left:120px}
  .rue .recherche svg{width:30px;height:30px}
  .rue .fiche{width:430px;right:80px;bottom:20px;padding:22px 26px}
  .rue .fiche b{font-size:30px}
  .rue .fiche .infos,.rue .note-etoiles{font-size:22px}
  .rue .gestes span{font-size:20px;padding:9px 16px}
  .bas-reel{position:absolute;left:80px;right:80px;bottom:150px;display:flex;align-items:center;justify-content:space-between;gap:30px}
  .marque-reel{display:flex;align-items:center;gap:18px;font-weight:900;font-stretch:125%;font-size:52px;color:#0f2340}
  .marque-reel svg{width:84px;height:84px}
  .prix-reel{background:#0f2340;color:#fff;border-radius:28px;padding:22px 30px;font-size:30px;font-weight:700;text-align:right;line-height:1.15}
  .prix-reel b{display:block;color:#ffc83d;font-size:62px;font-stretch:120%}
</style>
</head>
<body>
  <div class="haut-reel">
    <p class="phrase p1">Vos clients vous cherchent <em>sur Google.</em></p>
    <p class="phrase p2">Ils doivent tomber <em>sur vous.</em></p>
    <p class="phrase p3">Fiche Google à jour, en <em>7 jours.</em></p>
  </div>
  <div class="rue" id="rue">
    <div class="recherche"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span class="tape"></span><i class="curseur"></i></div>
    <div class="fiche"><b>Votre commerce</b><span class="note-etoiles">★★★★★ <em>avis récents</em></span><span class="infos"><span class="ouvert">Ouvert</span> · à 2 min à pied</span><span class="gestes"><span>Itinéraire</span><span>Appeler</span><span>Site</span></span></div>
  </div>
  <div class="bas-reel">
    <div class="marque-reel"><svg viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#0f2340"/><g fill="#f4e9d8"><circle cx="50" cy="27" r="10"/><path d="M29 50c5-9 13-14 21-14s16 5 21 14c-5-3-10-3-14 1-3 3-5 5-7 5s-4-2-7-5c-4-4-9-4-14-1z"/></g><path d="M50 69c-5-6-9-9-14-9-5 0-9 4-9 9s4 9 9 9c5 0 9-3 14-9s9-9 14-9c5 0 9 4 9 9s-4 9-9 9c-5 0-9-3-14-9z" fill="none" stroke="#ffc83d" stroke-width="6" stroke-linejoin="round"/></svg>augmain.com</div>
    <div class="prix-reel"><b>290 €</b>une seule fois</div>
  </div>
  <script src="/js/rue.js"></script>
</body>
</html>
